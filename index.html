<!DOCTYPE html>
<html>
<head>
  <title>AI Travel Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>✈️ AI Travel Agent</h1>
  <p>Plan your trip with AI</p>

  <input id="destination" placeholder="Destination">
  <input id="days" type="number" placeholder="Number of days">
  <input id="budget" type="number" placeholder="Budget">
  <input id="interests" placeholder="Interests">

  <button onclick="generatePlan()">Generate Travel Plan</button>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
